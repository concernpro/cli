name: Mirror

# The CLI is written in the private concernpro/cli-source. Each push to its
# main goes on to the public concernpro/cli, pushed with the token of the bot
# concerncli, so that the bot is the only one seen pushing there.
#
# concernpro/cli gets this file with the rest of the code. There the job is
# skipped: it runs only in concernpro/cli-source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One push at a time, in the order they came.
concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'concernpro/cli-source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history: the public repository is sent what it lacks.
          fetch-depth: 0
          # The push goes with the bot's token, not with this repository's.
          persist-credentials: false

      # Only forward: a commit made in concernpro/cli and not here stops
      # the mirror rather than being overwritten.
      - name: Push to concernpro/cli
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "::error::The secret PUBLIC_REPO_TOKEN is not set: a token of concerncli with Contents and Workflows, read and write, on concernpro/cli."
            exit 1
          fi
          git push "https://concerncli:${PUBLIC_REPO_TOKEN}@github.com/concernpro/cli.git" "HEAD:refs/heads/main"
